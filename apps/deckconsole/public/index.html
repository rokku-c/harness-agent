<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentdeck · 控制室</title>
<link rel="stylesheet" href="__DECK_BASE__/app.css">
</head>
<body>
<header><h1>agentdeck · 控制室</h1><span id="summary"></span></header>
<main>
<div id="notice"></div>
<section><h2>会话与代理 <button style="margin-left:10px" onclick="closeAll()" class="no">全部关闭</button></h2>
  <div class="row">
    <select id="openKind">
      <option value="demo">demo（内置演示 agent）</option>
      <option value="claude-code">claude code</option>
      <option value="codex">codex</option>
      <option value="gemini">gemini</option>
      <option value="pi">pi</option>
      <option value="effect">effect（需启动时注入模型）</option>
      <option value="effect-ops">effect-ops（审批执行循环，需注入模型）</option>
      <option value="claude-cc">claude-cc（SDK 进程内变体）</option>
      <option value="custom">custom</option>
    </select>
    <input id="openLabel" placeholder="会话标签" value="评审" style="max-width:200px">
    <button onclick="openSession()">开启会话</button>
  </div>
  <div class="row">
    <input id="openAuto" placeholder="自动同意工具(逗号分隔)，如 note_write,read" style="max-width:300px">
    <label style="color:#8fa1b1">默认决议
      <select id="openDefault" style="width:auto"><option value="ask">ask（询问）</option><option value="allow">allow（放行）</option><option value="deny">deny（拒绝）</option></select>
    </label>
    <span class="pill">会话级同意策略（demo 生效）</span>
  </div>
  <div id="launchers" class="row"></div>
  <div class="row"><select id="addKind">
    <option value="demo">demo</option><option value="claude-code">claude-code</option>
    <option value="claude-cc">claude-cc</option><option value="codex">codex</option>
    <option value="gemini">gemini</option><option value="pi">pi</option><option value="custom">custom</option>
  </select>
  <input id="addLabel" placeholder="新启动组标签" style="max-width:180px">
  <input id="addCfg" placeholder="启动配置 JSON（可选）">
  <button onclick="addLauncher()">添加启动组</button></div>
  <table id="sessions"><thead><tr><th>session</th><th>kind</th><th>状态</th><th>最近活动</th><th>操作</th></tr></thead><tbody></tbody></table>
</section>
<div class="grid">
<section><h2>session → 同意 映射</h2>
  <table id="consent"><thead><tr><th>session</th><th>条目</th><th>待批</th><th>同意</th><th>拒绝</th></tr></thead><tbody></tbody></table>
  <div id="pending"></div>
</section>
<section><h2>配置 → 统一映射 预览</h2>
  <div class="row"><select id="cfgKind">
    <option value="claude-code">claude-code</option><option value="codex">codex</option><option value="gemini">gemini</option><option value="pi">pi</option><option value="effect">effect</option><option value="custom">custom</option>
  </select>
  <button onclick="previewConfig()">归一预览</button>
  <button onclick="loadSample()">载入样例</button></div>
  <textarea id="cfgRaw" rows="5" spellcheck="false">{ "model": "claude-sonnet-4-5", "cwd": "/workspace", "permissionMode": "bypassPermissions", "allowedTools": ["Read", "Edit"] }</textarea>
  <pre id="cfgOut"></pre>
</section>
</div>
<section><h2>同意流水（session → consent）</h2><div id="flow"></div></section>
<section><h2>会话详情</h2><div id="detail"><p class="empty">点某行「详情」查看会话 transcript 与该会话的同意日志</p></div></section>
</main>
<script type="module" src="__DECK_BASE__/client/main.js"></script>
</body>

</html>
