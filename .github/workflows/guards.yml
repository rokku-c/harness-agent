name: guards

on:
  push:
  pull_request:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile

      - run: bun run typecheck
      - run: bun run --cwd apps/effect-server typecheck:client
        continue-on-error: true
      - run: bun scripts/check-lines.ts
      - run: bun scripts/check-comments.ts

      - run: bun run check:boundary
      - run: bun run check:ui
      - run: bun run check:inventory

      - run: curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y
      - run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: bun run check:proofs
