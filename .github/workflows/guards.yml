# The guards, run where nobody has to remember them.
#
# A proof nothing runs is a comment (`scripts/check-proofs.ts`), and the same is
# true of every other guard here: `bun run check:proofs` only means something if
# something runs it on a change that could break it. This runs the guards that
# are green on the current tree. Two are listed but not yet gates — each carries
# pre-existing debt, and a red run that everyone learns to ignore is worse than
# an honest comment:
#
#   * `check-lines` — 35 files predate the 100-line cap `CLAUDE.md` sets: 31 test
#     files and 4 under `agentdeck/src` and `effect-interface/src`. The count is
#     falling; make it a gate once it reaches zero, because a red run everyone
#     learns to ignore is worse than an honest comment.
#   * `typecheck:client` — 14 errors in the browser bundle's types.
#
name: guards

on:
  push:
  pull_request:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile

      - run: bun run typecheck
      - run: bun run --cwd apps/effect-server typecheck:client
        continue-on-error: true
      - run: bun scripts/check-lines.ts
        continue-on-error: true

      - run: bun run check:boundary
      - run: bun run check:ui
      - run: bun run check:inventory

      - run: bun test packages apps

      # Lean core only (no mathlib), so the toolchain is a download and a build
      # of `formal/` — `lake` resolves the version from `formal/lean-toolchain`.
      - run: curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y
      - run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: bun run check:proofs
