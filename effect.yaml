# effect-agent unified server — declared config
# auto-discovers plugin manifests under `roots` and boots the `enabled` ones.
# `server.control` exposes /-/planes (list/enable/disable/reload/unregister) on the
# listener below. It is unauthenticated, so it is only sane because that listener is
# bound to loopback; do not turn it on for a listener that is reachable.
server:
  control: true
network:
  role: main
  listeners:
    - id: main
      hostname: 127.0.0.1
      port: 8080
roots:
  - apps
enabled:
  - ai-gateway
  - board
  - deckconsole
  - ui-host
  - agentd
  - config
  - console
  - effect-apps
  - mcp-registry
  - mcp-gateway
  - mantis
  - monitor
  - herdr
bundles:
  - board
